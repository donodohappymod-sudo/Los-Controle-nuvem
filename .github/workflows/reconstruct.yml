name: Reconstruct project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release into repository root
        run: |
          unzip -o LOS_COLLECTOR_RELEASE.zip -d .release
          cp -a .release/LOS_COLLECTOR_RELEASE/. .
          rm -rf .release LOS_COLLECTOR_RELEASE.zip RECONSTRUCTION_TRIGGER.txt
      - name: Commit reconstructed project
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore LOS COLLECTOR project structure" || exit 0
          git push

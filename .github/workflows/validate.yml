name: Validate LOS COLLECTOR

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Core smoke tests
        run: npm run test:core
      - name: Production build
        run: npm run build
      - name: Docker build
        run: docker build -t los-collector:ci .

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Controle Nuvem</title>

<script src="https://unpkg.com/html5-qrcode" defer></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070707;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  touch-action:none;
  overscroll-behavior:none
}

body{
  user-select:none;
  -webkit-user-select:none
}

.screen{
  width:100%;
  height:100dvh;
  display:none;
  flex-direction:column;
  padding:
    max(20px,env(safe-area-inset-top))
    18px
    max(20px,env(safe-area-inset-bottom));
}

.screen.active{
  display:flex
}

/* INÍCIO */

#home{
  align-items:center;
  justify-content:center;
  text-align:center;
}

.logo{
  font-size:48px;
  margin-bottom:12px;
}

.title{
  font-size:30px;
  font-weight:800;
  margin:0 0 10px;
}

.subtitle{
  max-width:330px;
  color:#999;
  line-height:1.5;
  font-size:15px;
  margin:0 0 30px;
}

#scanButton{
  width:min(92vw,420px);
  min-height:58px;
  border:0;
  border-radius:18px;
  background:#fff;
  color:#050505;
  font-size:17px;
  font-weight:800;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
  touch-action:manipulation;
}

#scanButton:active{
  transform:scale(.97)
}

/* SCANNER */

#scanner{
  background:#000;
  align-items:center;
}

.scannerHeader{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.scannerTitle{
  font-size:20px;
  font-weight:800;
}

.closeButton{
  border:1px solid #333;
  background:#181818;
  color:#fff;
  border-radius:12px;
  padding:9px 14px;
  touch-action:manipulation;
}

.scannerArea{
  width:min(94vw,430px);
  margin:auto;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:24px;
}

.scanHelp{
  text-align:center;
  color:#aaa;
  font-size:14px;
  line-height:1.4;
  margin-top:18px;
}

/* CONECTANDO */

#connecting{
  align-items:center;
  justify-content:center;
  text-align:center;
}

.spinner{
  width:48px;
  height:48px;
  border:4px solid #292929;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:22px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.connectTitle{
  font-size:24px;
  font-weight:800;
  margin-bottom:8px;
}

.connectText{
  color:#999;
  max-width:300px;
  line-height:1.5;
}

/* CONTROLE */

#controller{
  justify-content:space-between;
}

.controllerHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.controllerTitle{
  font-size:20px;
  font-weight:800;
}

.status{
  font-size:12px;
  color:#ff7777;
}

.status.connected{
  color:#72ef8a;
}

.status.connecting{
  color:#ffd166;
}

.controls{
  width:100%;
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

/* JOYSTICK */

.joystick{
  width:min(42vw,190px);
  height:min(42vw,190px);
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #1c1c1c 0%,
      #111 65%,
      #090909 100%
    );
  border:2px solid #292929;
  box-shadow:
    inset 0 0 30px #000,
    0 8px 25px rgba(0,0,0,.5);
  touch-action:none;
}

.knob{
  width:82px;
  height:82px;
  position:absolute;
  left:50%;
  top:50%;
  margin-left:-41px;
  margin-top:-41px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #555,
      #2c2c2c 55%,
      #1c1c1c
    );
  border:2px solid #555;
  box-shadow:0 8px 20px rgba(0,0,0,.7);
  pointer-events:none;
}

/* BOTÕES */

.actions{
  position:relative;
  width:min(42vw,190px);
  height:min(42vw,190px);
}

.btn{
  position:absolute;
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:18px;
  font-weight:900;
  background:#252525;
  box-shadow:0 6px 15px rgba(0,0,0,.6);
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.btn:active,
.btn.pressed{
  transform:scale(.90);
  background:#444;
}

.y{
  top:0;
  left:50%;
  margin-left:-31px;
}

.x{
  left:0;
  top:50%;
  margin-top:-31px;
}

.b{
  right:0;
  top:50%;
  margin-top:-31px;
}

.a{
  bottom:0;
  left:50%;
  margin-left:-31px;
}

/* PAUSA */

.bottom{
  display:flex;
  justify-content:center;
}

.pause{
  width:58px;
  height:44px;
  border-radius:14px;
  border:1px solid #333;
  background:#151515;
  color:#ddd;
  font-size:20px;
  touch-action:none;
}

.pause:active,
.pause.pressed{
  background:#333;
  transform:scale(.94);
}

@media(max-height:650px){

  .joystick,
  .actions{
    width:145px;
    height:145px;
  }

  .knob{
    width:65px;
    height:65px;
    margin-left:-32.5px;
    margin-top:-32.5px;
  }

  .btn{
    width:52px;
    height:52px;
  }

  .y{
    margin-left:-26px;
  }

  .x,
  .b{
    margin-top:-26px;
  }

  .a{
    margin-left:-26px;
  }
}
</style>
</head>

<body>

<!-- TELA INICIAL -->

<section id="home" class="screen active">

  <div class="logo">🎮</div>

  <h1 class="title">
    Controle Nuvem
  </h1>

  <p class="subtitle">
    Abra o jogo na TV e escaneie o QR Code
    que aparece na tela.
  </p>

  <button id="scanButton">
    📷 ESCANEAR QR CODE DA TV
  </button>

</section>


<!-- SCANNER -->

<section id="scanner" class="screen">

  <div class="scannerHeader">

    <div class="scannerTitle">
      Escanear QR Code
    </div>

    <button id="closeScanner" class="closeButton">
      Fechar
    </button>

  </div>

  <div class="scannerArea">

    <div id="reader"></div>

    <p class="scanHelp">
      Aponte a câmera traseira para o QR Code
      que aparece na TV.
    </p>

  </div>

</section>


<!-- CONECTANDO -->

<section id="connecting" class="screen">

  <div class="spinner"></div>

  <div class="connectTitle">
    Conectando…
  </div>

  <div id="connectText" class="connectText">
    Tentando estabelecer a conexão.
  </div>

</section>


<!-- CONTROLE -->

<section id="controller" class="screen">

  <header class="controllerHeader">

    <div class="controllerTitle">
      🎮 Controle Nuvem
    </div>

    <div id="status" class="status">
      ● não conectado
    </div>

  </header>


  <div class="controls">

    <div
      id="stick"
      class="joystick"
      aria-label="Joystick digital"
    >

      <div
        id="knob"
        class="knob"
      ></div>

    </div>


    <div class="actions">

      <button class="btn y" data-k="KeyY">
        Y
      </button>

      <button class="btn x" data-k="KeyX">
        X
      </button>

      <button class="btn b" data-k="KeyB">
        B
      </button>

      <button class="btn a" data-k="KeyA">
        A
      </button>

    </div>

  </div>


  <div class="bottom">

    <button
      id="pause"
      class="pause"
      data-k="Escape"
    >
      ⏸
    </button>

  </div>

</section>


<script>

let ws = null;
let qrScanner = null;
let connecting = false;


/* TELAS */

function showScreen(id){

  document
    .querySelectorAll('.screen')
    .forEach(screen => {
      screen.classList.remove('active');
    });

  document
    .getElementById(id)
    .classList.add('active');
}


/* STATUS */

const status =
  document.getElementById('status');

function setStatus(text,type=''){

  status.textContent =
    '● ' + text;

  status.className =
    'status ' + type;
}


/* WEBSOCKET */

function connect(url){

  if(connecting) return;

  connecting = true;

  showScreen('connecting');

  document
    .getElementById('connectText')
    .textContent =
      'Tentando estabelecer a conexão.';


  if(
    !url ||
    !(
      url.startsWith('ws://') ||
      url.startsWith('wss://')
    )
  ){

    connecting = false;

    document
      .getElementById('connectText')
      .textContent =
        'QR Code lido, mas ele não contém uma conexão WebSocket compatível com o Controle Nuvem.';

    setTimeout(
      () => showScreen('home'),
      3500
    );

    return;
  }


  try{

    ws = new WebSocket(url);

  }catch(error){

    connecting = false;

    document
      .getElementById('connectText')
      .textContent =
        'Não foi possível iniciar a conexão.';

    setTimeout(
      () => showScreen('home'),
      2500
    );

    return;
  }


  ws.onopen = () => {

    connecting = false;

    showScreen('controller');

    setStatus(
      'conectado',
      'connected'
    );

  };


  ws.onclose = () => {

    connecting = false;

    setStatus(
      'desconectado'
    );

  };


  ws.onerror = () => {

    connecting = false;

    setStatus(
      'erro'
    );

  };

}


/* ENVIO */

function send(
  type,
  key,
  x=0,
  y=0
){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify({
        type,
        key,
        x,
        y,
        time:Date.now()
      })
    );

  }

}


/* BOTÕES */

document
  .querySelectorAll('[data-k]')
  .forEach(button => {

    button.addEventListener(
      'pointerdown',
      event => {

        event.preventDefault();

        button.classList.add('pressed');

        send(
          'keydown',
          button.dataset.k
        );

      }
    );


    button.addEventListener(
      'pointerup',
      event => {

        event.preventDefault();

        button.classList.remove('pressed');

        send(
          'keyup',
          button.dataset.k
        );

      }
    );


    button.addEventListener(
      'pointercancel',
      event => {

        button.classList.remove('pressed');

        send(
          'keyup',
          button.dataset.k
        );

      }
    );

  });


/* JOYSTICK */

const stick =
  document.getElementById('stick');

const knob =
  document.getElementById('knob');

let joystickActive = false;


function moveJoystick(event){

  const rect =
    stick.getBoundingClientRect();

  const centerX =
    rect.left + rect.width / 2;

  const centerY =
    rect.top + rect.height / 2;

  let dx =
    event.clientX - centerX;

  let dy =
    event.clientY - centerY;

  const max =
    Math.min(
      rect.width,
      rect.height
    ) * 0.28;

  const distance =
    Math.hypot(dx,dy);


  if(distance > max){

    dx =
      dx / distance * max;

    dy =
      dy / distance * max;

  }


  knob.style.transform =
    `translate(${dx}px,${dy}px)`;


  const x =
    Math.round(
      dx / max * 100
    );

  const y =
    Math.round(
      dy / max * 100
    );


  send(
    'axis',
    'Joystick',
    x,
    y
  );

}


stick.addEventListener(
  'pointerdown',
  event => {

    event.preventDefault();

    joystickActive = true;

    stick.setPointerCapture(
      event.pointerId
    );

    moveJoystick(event);

  }
);


stick.addEventListener(
  'pointermove',
  event => {

    if(!joystickActive) return;

    event.preventDefault();

    moveJoystick(event);

  }
);


function releaseJoystick(){

  if(!joystickActive) return;

  joystickActive = false;

  knob.style.transform =
    'translate(0,0)';

  send(
    'axis',
    'Joystick',
    0,
    0
  );

}


stick.addEventListener(
  'pointerup',
  releaseJoystick
);

stick.addEventListener(
  'pointercancel',
  releaseJoystick
);


/* SCANNER */

const scanButton =
  document.getElementById('scanButton');

const closeScanner =
  document.getElementById('closeScanner');


async function startScanner(){

  showScreen('scanner');


  if(
    typeof Html5Qrcode === 'undefined'
  ){

    alert(
      'O scanner ainda está carregando. Tente novamente.'
    );

    showScreen('home');

    return;

  }


  try{

    qrScanner =
      new Html5Qrcode('reader');


    await qrScanner.start(

      {
        facingMode:'environment'
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1

      },

      decodedText => {

        handleQRCode(decodedText);

      },

      errorMessage => {

        /*
         * A câmera procura continuamente.
         * Erros de leitura são normais e
         * não são mostrados.
         */

      }

    );

  }catch(error){

    console.error(
      'Erro ao iniciar câmera:',
      error
    );

    alert(
      'Não foi possível abrir a câmera. Verifique a permissão da câmera no Safari.'
    );

    await stopScanner();

    showScreen('home');

  }

}


/* QR LIDO */

async function handleQRCode(decodedText){

  if(connecting) return;

  connecting = true;

  await stopScanner();

  showScreen('connecting');


  document
    .getElementById('connectText')
    .textContent =
      'QR Code lido. Verificando a conexão…';


  /*
   * Não assumimos que o QR Code seja
   * da Netflix nem inventamos protocolo.
   */

  if(
    decodedText.startsWith('ws://') ||
    decodedText.startsWith('wss://')
  ){

    connecting = false;

    connect(decodedText);

    return;

  }


  document
    .getElementById('connectText')
    .textContent =
      'QR Code lido, mas o conteúdo não é uma conexão WebSocket compatível com o Controle Nuvem.';

  connecting = false;


  setTimeout(
    () => showScreen('home'),
    4000
  );

}


/* PARAR SCANNER */

async function stopScanner(){

  if(!qrScanner) return;


  try{

    if(qrScanner.isScanning){

      await qrScanner.stop();

    }

  }catch(error){

    console.warn(
      'Erro ao parar scanner:',
      error
    );

  }


  try{

    await qrScanner.clear();

  }catch(error){

  }


  qrScanner = null;

}


scanButton.addEventListener(
  'click',
  startScanner
);


closeScanner.addEventListener(
  'click',
  async () => {

    await stopScanner();

    showScreen('home');

  }
);


/* BLOQUEIA GESTOS ACIDENTAIS */

document.addEventListener(
  'gesturestart',
  event => {
    event.preventDefault();
  }
);

document.addEventListener(
  'gesturechange',
  event => {
    event.preventDefault();
  }
);

document.addEventListener(
  'gestureend',
  event => {
    event.preventDefault();
  }
);

</script>

</body>
</html>

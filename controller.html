<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Controle Nuvem</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;touch-action:none}
main{height:100dvh;padding:14px 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.status{font-size:12px;color:#ff7777}.connected{color:#73ed88}
#scan{display:flex;align-items:center;justify-content:center;gap:8px;margin:auto;width:min(92vw,430px);padding:14px;background:#171717;border:1px solid #333;border-radius:15px;font-size:16px;color:#fff}
#camera{display:none;position:fixed;inset:0;background:#000;z-index:5;flex-direction:column;align-items:center;justify-content:center}
video{width:100%;height:70%;object-fit:cover}.close{padding:12px 22px;border-radius:12px;background:#222;color:#fff;border:1px solid #555}
.controls{width:100%;max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.joystick{width:190px;height:190px;position:relative;border-radius:50%;background:#141414;border:2px solid #292929;box-shadow:inset 0 0 25px #000}
.knob{position:absolute;width:82px;height:82px;border-radius:50%;background:#303030;border:2px solid #555;left:52px;top:52px;box-shadow:0 7px 20px #000}
.actions{position:relative;width:190px;height:190px}
.btn{position:absolute;width:62px;height:62px;border:0;border-radius:50%;background:#242424;color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 12px #000}
.y{top:0;left:64px}.x{top:64px;left:0}.b{top:64px;right:0}.a{bottom:0;left:64px}
.btn:active{transform:scale(.9);background:#444}
.bottom{display:flex;justify-content:center}.small{padding:9px 14px;background:#151515;border:1px solid #333;border-radius:10px;color:#bbb}
</style>
</head>
<body>
<main>
<header><h1>🎮 Controle Nuvem</h1><span id="status" class="status">● não conectado</span></header>

<button id="scan">📷 Escanear QR Code da TV</button>

<div class="controls">
 <div class="joystick" id="stick"><div class="knob" id="knob"></div></div>
 <div class="actions">
  <button class="btn y" data-k="KeyY">Y</button>
  <button class="btn x" data-k="KeyX">X</button>
  <button class="btn b" data-k="KeyB">B</button>
  <button class="btn a" data-k="KeyA">A</button>
 </div>
</div>
<div class="bottom"><button class="small" id="pause" data-k="Escape">⏸</button></div>
</main>

<div id="camera"><video id="video" playsinline></video><canvas id="canvas" hidden></canvas><p>Aponte para o QR Code da TV</p><button class="close" id="close">Fechar</button></div>

<script>
let ws=null, scanTimer=null;
const status=document.querySelector('#status');
function setStatus(t,ok=false){status.textContent='● '+t;status.className=ok?'status connected':'status'}
function connect(url){
 try{ws=new WebSocket(url)}catch(e){return setStatus('QR inválido')}
 ws.onopen=()=>setStatus('conectado',true); ws.onclose=()=>setStatus('desconectado'); ws.onerror=()=>setStatus('erro');
}
function send(type,key,x=0,y=0){
 if(ws?.readyState===1) ws.send(JSON.stringify({type,key,x,y,time:Date.now()}));
}
document.querySelectorAll('[data-k]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();send('keydown',b.dataset.k)});
 b.addEventListener('pointerup',e=>{e.preventDefault();send('keyup',b.dataset.k)});
 b.addEventListener('pointercancel',()=>send('keyup',b.dataset.k));
});
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let active=false;
function move(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=54,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 send('axis','Joystick',Math.round(dx/max*100),Math.round(dy/max*100));
}
stick.onpointerdown=e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)}
stick.onpointermove=e=>{if(active)move(e)}
stick.onpointerup=e=>{active=false;knob.style.transform='translate(0,0)';send('axis','Joystick',0,0)}
stick.onpointercancel=stick.onpointerup;

const camera=document.querySelector('#camera'),video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
document.querySelector('#scan').onclick=async()=>{
 camera.style.display='flex';
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  video.srcObject=stream;await video.play();
  scanTimer=setInterval(async()=>{
   if('BarcodeDetector' in window){
    const detector=new BarcodeDetector({formats:['qr_code']});
    try{const codes=await detector.detect(video);if(codes[0]?.rawValue){connect(codes[0].rawValue);closeCamera()}}catch(e){}
   }else{
    // Safari sem BarcodeDetector: use QR scanner web app fallback below.
    ctx.canvas.width=video.videoWidth;ctx.canvas.height=video.videoHeight;ctx.drawImage(video,0,0);
   }
  },350);
 }catch(e){alert('Permita o acesso à câmera para escanear o QR Code.')}
};
function closeCamera(){clearInterval(scanTimer);if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());camera.style.display='none'}
document.querySelector('#close').onclick=closeCamera;
</script>
</body>
</html>

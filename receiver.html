<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle Nuvem — TV</title>
<style>body{margin:0;background:#07070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;text-align:center;min-height:100vh;display:grid;place-items:center}.box{width:min(86vw,700px);padding:40px}.logo{font-size:44px}.tag{display:inline-block;border:1px solid #292a34;background:#111218;border-radius:999px;padding:8px 12px;color:#a8aab5;font-size:12px}.code{font-size:64px;font-weight:950;letter-spacing:.16em;margin:20px 0}.state{color:#8ef0d0}.hint{color:#777b88;line-height:1.5}</style></head>
<body><div class="box"><div class="logo">🎮</div><div class="tag">CONTROLE NUVEM · RECEPTOR</div><h1>Pronto para jogar</h1><p class="hint">Abra o Controle Nuvem no celular e conecte-se a esta sessão.</p><div class="code" id="code">------</div><div class="state" id="state">Aguardando controle…</div></div>
<script>
const params=new URLSearchParams(location.search);
const code=params.get('code') || String(Math.floor(100000+Math.random()*900000));
document.querySelector('#code').textContent=code;
const wsUrl=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?role=receiver&code='+encodeURIComponent(code);
const ws=new WebSocket(wsUrl);
ws.onopen=()=>document.querySelector('#state').textContent='● receptor online · aguardando controle';
ws.onclose=()=>document.querySelector('#state').textContent='○ receptor desconectado';
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='button')document.querySelector('#state').textContent=`● ${m.key} ${m.state}`;if(m.type==='axis')document.querySelector('#state').textContent=`● joystick ${m.x}, ${m.y}`}catch{}};
</script></body></html>
